<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetworkPolicy Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Kubernetes NetworkPolicy Simulator</h1>

  <section class="panel">
    <h2>1. Policies</h2>
    <label><input type="checkbox" id="denyAll"> default-deny-ingress</label>
    <label><input type="checkbox" id="fb"> allow-frontend-to-backend</label>
    <label><input type="checkbox" id="bd"> allow-backend-to-database</label>
  </section>

  <section class="panel">
    <h2>2. Pods</h2>
    <div class="pods">
      <div class="pod" id="frontend">Frontend<br><small>app=frontend</small></div>
      <div class="pod" id="backend">Backend<br><small>app=backend</small></div>
      <div class="pod" id="database">Database<br><small>app=database</small></div>
      <div class="pod" id="test-client">Test Client<br><small>app=test-client</small></div>
    </div>
  </section>

  <section class="panel">
    <h2>3. Test connection</h2>
    <select id="src">
      <option value="frontend">frontend</option>
      <option value="backend">backend</option>
      <option value="test-client">test-client</option>
    </select>
    →
    <select id="dst">
      <option value="backend">backend</option>
      <option value="database">database</option>
      <option value="frontend">frontend</option>
    </select>
    <button id="testBtn">Test</button>
    <button id="allBtn">Run all tests</button>
    <p id="result"></p>
    <table id="table"></table>
  </section>

  <script src="script.js"></script>
</body>
</html>
